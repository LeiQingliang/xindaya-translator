name: Tool bug / 工具问题
description: Report a reproducible problem with local utilities or packaging.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Use anonymized inputs. Report vulnerabilities through SECURITY.md, not a public issue."
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: Skill version or commit, operating system, Python version, and host if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction / 复现步骤
      description: Include the exact command and the smallest safe input that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
      description: Include the output or error. Remove private paths and sensitive data as needed.
    validations:
      required: true
